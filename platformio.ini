; Build without Arduino IDE (its bundled ctags is x86 only). Libraries come from ~/Documents/Arduino/libraries.
[platformio]
src_dir = src/MBusino5S-DAC

[env:lolin_s2_mini]
platform = espressif32@7.0.1
board = lolin_s2_mini
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_ldf_mode = chain+
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
